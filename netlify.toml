[[redirects]]
  from = "/article/:slug"
  to = "/articles/article.html"
  status = 200
  force = false

[[redirects]]
  from = "/ivy-cms"
  to = "/admin.html"
  status = 200
  force = false

[[redirects]]
  from = "/admin.html"
  to = "/admin.html"
  status = 200
  force = true

[[redirects]]
  from = "/:slug.html"
  to = "/article.html?slug=:slug"
  status = 200
  force = false

[[redirects]]
  from = "/articles/:slug.html"
  to = "/article.html?slug=:slug"
  status = 200
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/admin.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
