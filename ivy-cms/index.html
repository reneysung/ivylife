const CustomHeading=Heading.extend({addAttributes(){return{...this.parent?.(),id:{default:null,parseHTML:el=>el.getAttribute('id')||null,renderHTML:a=>a.id?{id:a.id}:{}},style:{default:null,parseHTML:el=>el.getAttribute('style')||null,renderHTML:a=>a.style?{style:a.style}:{}}};}});

async function sb(path,opts={}){

  return (r.status===204||r.status===201)?null:r.json();
}

}

async function delArt(id){
  if(!confirm('確定要刪除這篇文章？此操作不可撤銷'))return;
  // Optimistic UI: 立即從列表移除
  var row=document.querySelector('[data-art-id="'+id+'"]');
  var parent=row?row.parentElement:null;
  var nextSibling=row?row.nextSibling:null;
  if(row)row.remove();
  toast('✓ 刪除中...');
  // 背景發送 DELETE
  try{
    await sb('/rest/v1/ivy_articles?id=eq.'+id,{method:'DELETE'});
    toast('文章已刪除');
  }catch(e){
    // 失敗則還原列表
    if(row&&parent){
      if(nextSibling)parent.insertBefore(row,nextSibling);
      else parent.appendChild(row);
    }
    toast('刪除失敗：'+e.message,1);
  }
}

function initEditor(){

    element:document.getElementById('tiptap-editor'),
    extensions:[
      StarterKit.configure({heading:false,paragraph:{},codeBlock:{}}),
      CustomHeading.configure({levels:[2,3,4]}),
      TextStyle,Color,Underline,
      CustomLink.configure({openOnClick:false,autolink:true}),
      CustomImage.configure({inline:false}),
    ],
    editorProps:{attributes:{style:'min-height:220px;padding:12px;outline:none'}},
    onUpdate(){ttUpdateBar()},
    onSelectionUpdate(){ttUpdateBar()},
  });
  ttBuildBar();
}

function ttPromptImgLink(img){
  if(!img||!window.editor)return;
  var currentHref='';
  var wrappingA=img.closest('a');
  if(wrappingA)currentHref=wrappingA.getAttribute('href')||'';
  if(!currentHref)currentHref=img.getAttribute('data-link')||'';
  var url=prompt('設定圖片點擊後要前往的連結網址：\n\n(輸入空白即可移除連結)', currentHref);
  if(url===null)return;
  var src=img.getAttribute('src')||'';
  // 用 editor state 找到這張圖片的 position
  var pos=null;
  window.editor.state.doc.descendants(function(node,p){
    if(node.type.name==='image'&&node.attrs.src===src){pos=p;return false;}
  });
  if(pos===null){toast('找不到圖片，請再試一次',1);return;}
  // 更新 attribute
  var tr=window.editor.state.tr;
  var node=window.editor.state.doc.nodeAt(pos);
  tr.setNodeMarkup(pos,undefined,Object.assign({},node.attrs,{dataLink:url.trim()||null}));
  window.editor.view.dispatch(tr);
  toast(url.trim()?'✅ 已加上連結':'已移除連結');
}

// \u524d\u7aef\u628a\u4e0a\u50b3\u5716\u8f49\u6210 WebP\uff08\u6700\u5927\u5bec\u5ea6 maxW\u3001\u54c1\u8cea q\uff09\u2192 \u65b0\u4e0a\u50b3\u4e5f\u512a\u5316\u3001\u8207\u5df2\u642c\u9077 R2 \u5716\u4e00\u81f4
function toWebpBlob(file,maxW,q,type){
  return new Promise(function(resolve,reject){
    const img=new Image();
    img.onload=function(){
      let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
      if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      c.toBlob(function(b){b?resolve(b):reject(new Error('toBlob failed'));},type||'image/webp',q||0.72);
    };
    img.onerror=function(){reject(new Error('image load failed'));};
    img.src=URL.createObjectURL(file);
  });
}
function ttImg(){
  const qfi=document.getElementById('qfi');
  if(!qfi||!window.editor)return;
  window._masp=document.querySelector('.ma')?.scrollTop||0;
  window._wsp=window.scrollY;
  qfi.value='';
  qfi.onchange=async function(){
    const file=qfi.files[0];if(!file)return;qfi.onchange=null;
    const fn='img-'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.webp';
    try{
      const blob=await toWebpBlob(file,1200,0.72);
      const r=await fetch('/ivy-cms/r2-upload?fn='+encodeURIComponent(fn),{method:'POST',headers:{'Content-Type':'image/webp'},body:blob});
      if(!r.ok)throw new Error(await r.text());
      const url=(await r.json()).url;
      editor.chain().focus().setImage({src:url}).run();
      setTimeout(function(){const ma=document.querySelector('.ma');if(ma)ma.scrollTop=window._masp;window.scrollTo(0,window._wsp);},100);
      if(ts){ts.className='ts';ts.textContent='\u2705 \u4e0a\u50b3\u6210\u529f';}
    }catch(e){if(ts){ts.className='ts sh';ts.textContent='\u26a0\ufe0f \u5931\u6557';}}
  };
  qfi.click();
}

async function saveAsDraft(){
  try{
    const t=document.getElementById('eti')?.value?.trim();

    await saveArt();
    if(pubSwitch)pubSwitch.checked=origPub;

    try{localStorage.removeItem('ivy-draft-'+s);}catch(e){}

function autoSaveDraft(){

  try{
    const data={
      t:document.getElementById('eti')?.value||'',
      s:document.getElementById('esl')?.value||'',
      c:window.editor.getHTML(),
      cat:document.getElementById('ecat')?.value||'',
      syn:document.getElementById('esyn')?.value||'',
      ts:Date.now()
    };
    if(!data.t&&!data.c)return;
    localStorage.setItem(_getDraftKey(),JSON.stringify(data));
    const ind=document.getElementById('draft-ind');
    if(ind){ind.textContent='✓ 已自動暫存';ind.style.opacity='1';setTimeout(()=>{if(ind)ind.style.opacity='.5';},2000);}
  }catch(e){}
}
function restoreDraft(){
  if(eid)return; // 編輯舊文章不 restore
  try{
    const key='ivy-draft-new';
    const raw=localStorage.getItem(key);
    if(!raw)return;
    const d=JSON.parse(raw);
    if(!d.t&&!d.c)return;
    if(!confirm('找到上次未儲存的草稿，是否恢復？\n標題：'+(d.t||'(無)')))return;
    if(document.getElementById('eti'))document.getElementById('eti').value=d.t||'';
    if(document.getElementById('esl'))document.getElementById('esl').value=d.s||'';
    if(document.getElementById('esyn'))document.getElementById('esyn').value=d.syn||'';
    if(d.cat&&document.getElementById('ecat'))document.getElementById('ecat').value=d.cat;
    if(window.editor&&d.c)window.editor.commands.setContent(d.c,false);
    else if(d.c)document.addEventListener('tiptap-ready',()=>window.editor.commands.setContent(d.c,false),{once:true});
  }catch(e){}
}

    cover_image:document.getElementById('ecov')?.value.trim()||null,

  try{
    if(id){await sb('/rest/v1/ivy_articles?id=eq.'+id,{method:'PATCH',body:JSON.stringify(data)});toast('\u6587\u7ae0\u5df2\u66f4\u65b0 \u2705');}
    else{await sb('/rest/v1/ivy_articles',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify(data)});toast('\u6587\u7ae0\u5df2\u5efa\u7acb \u2705');}
    go('ar');
  }catch(e){toast('\u5132\u5b58\u5931\u6557\uff1a'+e.message,1);}
}

async function uploadCover(e){
  const file=e.target.files?.[0];if(!file)return;
  const cs=document.getElementById('cps'),ci=document.getElementById('cpi'),cw=document.getElementById('cpw');
  if(ci)ci.src=URL.createObjectURL(file);if(cw)cw.style.display='flex';
  if(cs){cs.textContent='\u23eb \u4e0a\u50b3\u4e2d...';cs.style.color='#888';}
  const fn='cover-'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.jpg';
  try{
    const blob=await toWebpBlob(file,1200,0.85,'image/jpeg');
    const r=await fetch('/ivy-cms/r2-upload?fn='+encodeURIComponent(fn),{method:'POST',headers:{'Content-Type':'image/jpeg'},body:blob});
    if(!r.ok){const t=await r.text();throw new Error(t);}
    const ec=document.getElementById('ecov');if(ec)ec.value=(await r.json()).url;
    if(cs){cs.textContent='\u2705 \u4e0a\u50b3\u6210\u529f';cs.style.color='#4caf50';}
  }catch(err){if(cs){cs.textContent='\u274c \u4e0a\u50b3\u5931\u6557';cs.style.color='#ef4444';}}
  e.target.value='';
}

async function loadCA(){
  try{const cats=await sb('/rest/v1/ivy_categories?select=id,name,slug,sort_order&order=sort_order');
  const el=document.getElementById('cl');
  if(el)el.innerHTML=cats.map(c=>`<tr style="border-top:1px solid #f0e8e8"><td style="padding:12px 16px;font-weight:600">${c.name}</td><td style="padding:12px 16px;color:var(--gray)">${c.slug}</td><td style="padding:12px 16px;text-align:center">${c.sort_order}</td><td style="padding:12px 16px;text-align:center"><button class="btn bs" style="margin-right:6px;font-size:12px" onclick="editCat(${c.id},'${c.name}','${c.slug}',${c.sort_order})">\u270f\ufe0f</button><button class="btn" style="background:#e05a5a;font-size:12px;padding:4px 10px" onclick="delCat(${c.id})">\ud83d\uddd1\ufe0f</button></td></tr>`).join('');
  const sel=document.getElementById('ecat');
  if(sel)sel.innerHTML='<option value="">-- \u9078\u64c7\u5206\u985e --</option>'+cats.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
  }catch(e){toast('\u8f09\u5165\u5206\u985e\u5931\u6557',1);}
}
async function addCat(){

async function buildNavCats(){const cats=await sb('/rest/v1/ivy_categories?select=id,name,slug&order=sort_order');const nav=document.getElementById('nav-list');if(!nav||!cats)return;cats.forEach(c=>{if(!document.querySelector('#nav-list li[data-cat="'+c.slug+'"]')){const li=document.createElement('li');li.setAttribute('data-cat',c.slug);li.innerHTML='<a href="#">'+c.name+'</a>';nav.appendChild(li);}});}
async function delCat(id){
  if(!confirm('\u78ba\u5b9a\u522a\u9664\u6b64\u5206\u985e\uff1f'))return;
