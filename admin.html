<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>IvyLife 後台管理</title>
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',system-ui,sans-serif;background:#f8f4f5;color:#2d2020;min-height:100vh}

/* ── LOGIN ── */
#loginPage{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#fff0f2,#fde8d8)}
.login-box{background:white;border-radius:20px;padding:2.5rem;width:380px;box-shadow:0 12px 40px rgba(212,105,122,.18);text-align:center}
.ivy-logo-wrap{margin-bottom:1.2rem}
.ivy-logo-svg{width:120px;height:auto}
.login-sub{color:#a08085;font-size:.85rem;margin-bottom:2rem}
.login-box input{width:100%;padding:11px 14px;border:1.5px solid rgba(212,105,122,.25);border-radius:10px;font-size:.95rem;margin-bottom:1rem;outline:none;font-family:inherit;transition:border-color .2s}
.login-box input:focus{border-color:#d4697a;box-shadow:0 0 0 3px rgba(212,105,122,.1)}
.btn-primary{width:100%;padding:12px;background:linear-gradient(135deg,#d4697a,#e8899a);color:white;border:none;border-radius:50px;font-size:.95rem;cursor:pointer;font-family:inherit;font-weight:500;transition:all .2s}
.btn-primary:hover{background:linear-gradient(135deg,#c05a6a,#d4697a);transform:translateY(-1px);box-shadow:0 4px 12px rgba(212,105,122,.3)}
.login-err{color:#d4697a;font-size:.82rem;margin-top:.5rem;display:none}

/* ── ADMIN LAYOUT ── */
#adminPage{display:none;min-height:100vh}
.sidebar{position:fixed;left:0;top:0;width:230px;height:100vh;background:#2d2020;color:white;padding:1.5rem 0;z-index:10;display:flex;flex-direction:column}
.sidebar-logo{padding:0 1.5rem 1.5rem;border-bottom:1px solid rgba(255,255,255,.1)}
.sidebar-logo svg{width:110px;height:auto}
.sidebar-menu{list-style:none;padding:1rem 0;flex:1}
.sidebar-menu li a{display:flex;align-items:center;gap:.7rem;padding:.75rem 1.5rem;color:rgba(255,255,255,.7);text-decoration:none;font-size:.88rem;transition:all .2s;cursor:pointer}
.sidebar-menu li a:hover,.sidebar-menu li a.active{background:rgba(242,165,176,.15);color:white;border-right:3px solid #f2a5b0}
.sidebar-footer{padding:1rem 1.5rem;border-top:1px solid rgba(255,255,255,.1)}
.sidebar-footer button{width:100%;padding:8px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.6);border:none;border-radius:8px;cursor:pointer;font-size:.82rem;font-family:inherit}
.sidebar-footer button:hover{background:rgba(255,255,255,.2);color:white}
.main{margin-left:230px;padding:2rem;min-height:100vh}
.page-header{margin-bottom:2rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem}
.page-header h1{font-size:1.4rem;font-weight:500}

/* ── BUTTONS ── */
.btn{padding:8px 20px;border-radius:50px;font-size:.85rem;cursor:pointer;border:none;transition:all .2s;font-family:inherit}
.btn-rose{background:#d4697a;color:white}.btn-rose:hover{background:#c05a6a}
.btn-outline{background:transparent;color:#d4697a;border:1.5px solid #d4697a}.btn-outline:hover{background:#fff0f2}
.btn-sm{padding:5px 14px;font-size:.78rem}
.btn-danger{background:#e74c3c;color:white}.btn-danger:hover{background:#c0392b}
.btn-success{background:#27ae60;color:white}.btn-success:hover{background:#219a52}
.btn-ai{background:linear-gradient(135deg,#667eea,#764ba2);color:white;display:flex;align-items:center;gap:.4rem}
.btn-ai:hover{background:linear-gradient(135deg,#5a6fd6,#6a4292);transform:translateY(-1px)}

/* ── CARDS / TABLES ── */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:2rem}
.stat-card{background:white;border-radius:14px;padding:1.2rem 1.5rem;border:1px solid rgba(212,105,122,.1)}
.stat-num{font-size:2rem;font-weight:500;color:#d4697a}
.stat-label{font-size:.8rem;color:#a08085;margin-top:.2rem}
.card{background:white;border-radius:14px;border:1px solid rgba(212,105,122,.1);overflow:hidden;margin-bottom:1.5rem}
.card-header{padding:1rem 1.5rem;border-bottom:1px solid rgba(212,105,122,.08);display:flex;align-items:center;justify-content:space-between;font-size:.9rem;font-weight:500}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{padding:.7rem 1.2rem;text-align:left;background:#fdf8f4;color:#a08085;font-weight:400;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
td{padding:.75rem 1.2rem;border-top:1px solid rgba(212,105,122,.08);vertical-align:middle}
tr:hover td{background:#fdf8f4}
.badge{display:inline-block;padding:2px 10px;border-radius:50px;font-size:.72rem}
.badge-green{background:#e8f5e9;color:#2e7d32}
.badge-gray{background:#f5f5f5;color:#757575}
.actions{display:flex;gap:.4rem;flex-wrap:wrap}
.panel{display:none}.panel.active{display:block}
.toolbar{display:flex;gap:.8rem;margin-bottom:1rem;flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select{padding:8px 14px;border:1.5px solid rgba(212,105,122,.2);border-radius:50px;font-size:.85rem;outline:none;font-family:inherit;background:white}
.toolbar input{min-width:200px}.toolbar input:focus,.toolbar select:focus{border-color:#d4697a}
.empty-state{text-align:center;padding:3rem;color:#a08085;font-size:.9rem}

/* ── EDITOR FORM ── */
.editor-form{padding:1.5rem;display:flex;flex-direction:column;gap:1.2rem}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem}
.form-group{display:flex;flex-direction:column;gap:.4rem}
.form-group label{font-size:.8rem;color:#a08085;font-weight:400}
.form-group input,.form-group select,.form-group textarea{padding:9px 12px;border:1.5px solid rgba(212,105,122,.2);border-radius:8px;font-size:.9rem;font-family:inherit;outline:none;transition:border-color .2s;background:white;color:#2d2020}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#d4697a;box-shadow:0 0 0 3px rgba(212,105,122,.1)}
.form-group textarea{min-height:100px;resize:vertical;line-height:1.7}
.form-actions{display:flex;gap:.8rem;padding-top:.5rem;flex-wrap:wrap}
.section-title{font-size:.9rem;font-weight:600;color:#d4697a;padding:.5rem 0;border-bottom:2px solid rgba(212,105,122,.15);margin-bottom:.5rem;display:flex;align-items:center;gap:.5rem}

/* ── QUILL ── */
.ql-container{border:1.5px solid rgba(212,105,122,.2)!important;border-top:none!important;border-radius:0 0 8px 8px!important;min-height:300px;font-family:'Noto Sans TC',sans-serif!important;font-size:.9rem}
.ql-toolbar{border:1.5px solid rgba(212,105,122,.2)!important;border-radius:8px 8px 0 0!important;background:#fdf8f4}
.ql-editor{min-height:280px;line-height:1.8}

/* ── COVER UPLOAD ── */
.cover-row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.cover-row input[type=text]{flex:1;min-width:200px}
.upload-btn{cursor:pointer;background:#c9697a;color:#fff;padding:.4rem .8rem;border-radius:6px;font-size:.82rem;white-space:nowrap;user-select:none}
.upload-btn input{display:none}
.ai-gen-btn{cursor:pointer;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:.4rem .9rem;border-radius:6px;font-size:.82rem;border:none;font-family:inherit;display:flex;align-items:center;gap:.3rem}
.ai-gen-btn:hover{opacity:.9}
#coverPreviewWrap{margin-top:.5rem;display:none}
#coverPreview{max-width:220px;max-height:130px;object-fit:cover;border-radius:6px;border:1.5px solid #e0d4d5}
#coverUploadStatus{font-size:.78rem;margin-left:.5rem;color:#888}

/* ── STORE INFO ── */
.store-card{background:linear-gradient(135deg,#fff8f0,#fff0f2);border:1.5px solid rgba(212,105,122,.15);border-radius:12px;padding:1.2rem}

/* ── TOAST ── */
.toast{position:fixed;bottom:2rem;right:2rem;padding:12px 20px;background:#2d2020;color:white;border-radius:8px;font-size:.85rem;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;max-width:320px}
.toast.show{opacity:1}

/* ── AI PANEL ── */
.ai-overlay{display:none;position:fixed;inset:0;background:rgba(45,32,32,.5);z-index:100;align-items:center;justify-content:center}
.ai-overlay.show{display:flex}
.ai-box{background:white;border-radius:20px;padding:2rem;width:440px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.ai-box h3{font-size:1.1rem;margin-bottom:1rem;color:#2d2020;display:flex;align-items:center;gap:.5rem}
.ai-progress{width:100%;height:6px;background:#f0e8e8;border-radius:3px;margin:1rem 0;overflow:hidden}
.ai-progress-bar{height:100%;background:linear-gradient(90deg,#667eea,#d4697a);border-radius:3px;width:0%;transition:width .5s}
.ai-status{font-size:.85rem;color:#a08085;text-align:center;min-height:40px}
.ai-preview{width:100%;max-height:180px;object-fit:cover;border-radius:8px;margin-top:1rem;display:none}

@media(max-width:768px){.stats-grid{grid-template-columns:repeat(2,1fr)}.form-row,.form-row-3{grid-template-columns:1fr}.sidebar{width:180px}.main{margin-left:180px}}
</style>
</head>
<body>

<!-- IVY LOGO SVG (inline reusable) -->
<svg style="display:none">
  <symbol id="ivy-logo-full" viewBox="0 0 200 52">
    <g transform="translate(0,2)">
      <!-- leaf cluster -->
      <ellipse cx="18" cy="24" rx="14" ry="9" fill="#d4697a" transform="rotate(-25,18,24)" opacity=".9"/>
      <ellipse cx="26" cy="14" rx="11" ry="7" fill="#c05a6a" transform="rotate(15,26,14)" opacity=".85"/>
      <ellipse cx="30" cy="28" rx="12" ry="7" fill="#e8899a" transform="rotate(40,30,28)" opacity=".8"/>
      <ellipse cx="12" cy="32" rx="9" ry="6" fill="#b04868" transform="rotate(-45,12,32)" opacity=".75"/>
      <!-- stem -->
      <path d="M22 42 Q20 30 18 24" stroke="#c05a6a" stroke-width="1.5" fill="none"/>
    </g>
    <!-- text -->
    <text x="46" y="32" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#d4697a" letter-spacing="-0.5">Ivy</text>
    <text x="78" y="32" font-family="Georgia,serif" font-size="22" font-style="italic" fill="#c9996a" letter-spacing="-0.5">Life</text>
    <text x="46" y="44" font-family="'Noto Sans TC',sans-serif" font-size="8" fill="#a08085" letter-spacing="2">後台管理系統</text>
  </symbol>
  <symbol id="ivy-logo-sm" viewBox="0 0 160 44">
    <g transform="translate(0,2)">
      <ellipse cx="16" cy="20" rx="12" ry="8" fill="#d4697a" transform="rotate(-25,16,20)" opacity=".9"/>
      <ellipse cx="23" cy="12" rx="9" ry="6" fill="#c05a6a" transform="rotate(15,23,12)" opacity=".85"/>
      <ellipse cx="27" cy="24" rx="10" ry="6" fill="#e8899a" transform="rotate(40,27,24)" opacity=".8"/>
      <path d="M20 36 Q18 26 16 20" stroke="#c05a6a" stroke-width="1.5" fill="none"/>
    </g>
    <text x="40" y="28" font-family="Georgia,serif" font-size="19" font-weight="700" fill="#f2a5b0" letter-spacing="-0.5">Ivy</text>
    <text x="68" y="28" font-family="Georgia,serif" font-size="19" font-style="italic" fill="#c9996a" letter-spacing="-0.5">Life</text>
  </symbol>
</svg>

<!-- LOGIN -->
<div id="loginPage">
<div class="login-box">
  <div class="ivy-logo-wrap">
    <svg class="ivy-logo-svg" viewBox="0 0 200 52"><use href="#ivy-logo-full"/></svg>
  </div>
  <div class="login-sub">生活旅遊後台管理系統</div>
  <input type="password" id="pwInput" placeholder="請輸入管理員密碼">
  <button class="btn-primary" onclick="doLogin()">登入後台</button>
  <div class="login-err" id="loginErr">密碼錯誤，請重新輸入</div>
</div>
</div>

<!-- ADMIN -->
<div id="adminPage">
<nav class="sidebar">
  <div class="sidebar-logo">
    <svg viewBox="0 0 160 44"><use href="#ivy-logo-sm"/></svg>
  </div>
  <ul class="sidebar-menu">
    <li><a class="active" onclick="showPanel('dashboard',this)">📊 網站總覽</a></li>
    <li><a onclick="showPanel('articles',this)">📝 文章管理</a></li>
    <li><a onclick="showPanel('new',this)">✏️ 新增文章</a></li>
    <li><a onclick="showPanel('categories',this)">🏷️ 分類管理</a></li>
  </ul>
  <div class="sidebar-footer">
    <button onclick="window.open('/','_blank')">↗ 前往前台</button>
  </div>
</nav>

<main class="main">

<!-- DASHBOARD -->
<div id="panel-dashboard" class="panel active">
  <div class="page-header"><h1>📊 網站總覽</h1><span style="font-size:.8rem;color:#a08085" id="lastUpdate"></span></div>
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-num" id="s1">-</div><div class="stat-label">總文章數</div></div>
    <div class="stat-card"><div class="stat-num" id="s2">-</div><div class="stat-label">已發布</div></div>
    <div class="stat-card"><div class="stat-num" id="s3">-</div><div class="stat-label">草稿</div></div>
    <div class="stat-card"><div class="stat-num" id="s4">-</div><div class="stat-label">分類數</div></div>
  </div>
  <div class="card">
    <div class="card-header">最新 10 篇文章 <button class="btn btn-sm btn-rose" onclick="showPanel('new',document.querySelector('.sidebar-menu li:nth-child(3) a'))">+ 新增</button></div>
    <table><thead><tr><th>標題</th><th>分類</th><th>縣市</th><th>狀態</th><th>日期</th></tr></thead><tbody id="dashRecent"></tbody></table>
  </div>
</div>

<!-- ARTICLES -->
<div id="panel-articles" class="panel">
  <div class="page-header">
    <h1>📝 文章管理</h1>
    <button class="btn btn-rose" onclick="showPanel('new',document.querySelector('.sidebar-menu li:nth-child(3) a'))">+ 新增文章</button>
  </div>
  <div class="toolbar">
    <input type="text" id="searchQ" placeholder="搜尋標題或 slug…" oninput="filterList()">
    <select id="filterCat" onchange="filterList()"><option value="">全部分類</option></select>
    <select id="filterCity" onchange="filterList()">
      <option value="">全部縣市</option>
      <option value="台北市">台北市</option><option value="新北市">新北市</option><option value="桃園市">桃園市</option><option value="台中市">台中市</option><option value="台南市">台南市</option><option value="高雄市">高雄市</option><option value="基隆市">基隆市</option><option value="新竹市">新竹市</option><option value="嘉義市">嘉義市</option><option value="新竹縣">新竹縣</option><option value="苗栗縣">苗栗縣</option><option value="彰化縣">彰化縣</option><option value="南投縣">南投縣</option><option value="雲林縣">雲林縣</option><option value="嘉義縣">嘉義縣</option><option value="屏東縣">屏東縣</option><option value="宜蘭縣">宜蘭縣</option><option value="花蓮縣">花蓮縣</option><option value="台東縣">台東縣</option><option value="澎湖縣">澎湖縣</option><option value="金門縣">金門縣</option><option value="連江縣">連江縣</option>
    </select>
    <select id="filterPub" onchange="filterList()"><option value="">全部狀態</option><option value="true">已發布</option><option value="false">草稿</option></select>
  </div>
  <div class="card">
    <table><thead><tr><th>標題</th><th>分類</th><th>縣市</th><th>Slug</th><th>狀態</th><th>日期</th><th>操作</th></tr></thead>
    <tbody id="artList"></tbody></table>
  </div>
</div>

<!-- NEW / EDIT -->
<div id="panel-new" class="panel">
  <div class="page-header">
    <h1 id="edTitle">✏️ 新增文章</h1>
    <button class="btn btn-outline" onclick="resetForm()">✕ 取消</button>
  </div>
  <div class="card">
    <div class="editor-form">
      <input type="hidden" id="edId">

      <!-- 基本資料 -->
      <div class="section-title">📄 基本資料</div>
      <div class="form-group"><label>文章標題 *</label><input type="text" id="edTitleInput" placeholder="例：台南必吃！這家拉麵讓我念念不忘"></div>
      <div class="form-row">
        <div class="form-group"><label>Slug（網址）* <span style="color:#d4697a;font-size:.75rem">— 英文小寫+數字+連字號</span></label><input type="text" id="edSlug" placeholder="tainan-ramen-01"></div>
        <div class="form-group"><label>分類</label><select id="edCat"><option value="">-- 選擇分類 --</option></select></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>縣市</label>
          <select id="edCity">
            <option value="">-- 選擇縣市 --</option>
            <option value="台北市">台北市</option><option value="新北市">新北市</option><option value="桃園市">桃園市</option><option value="台中市">台中市</option><option value="台南市">台南市</option><option value="高雄市">高雄市</option><option value="基隆市">基隆市</option><option value="新竹市">新竹市</option><option value="嘉義市">嘉義市</option><option value="新竹縣">新竹縣</option><option value="苗栗縣">苗栗縣</option><option value="彰化縣">彰化縣</option><option value="南投縣">南投縣</option><option value="雲林縣">雲林縣</option><option value="嘉義縣">嘉義縣</option><option value="屏東縣">屏東縣</option><option value="宜蘭縣">宜蘭縣</option><option value="花蓮縣">花蓮縣</option><option value="台東縣">台東縣</option><option value="澎湖縣">澎湖縣</option><option value="金門縣">金門縣</option><option value="連江縣">連江縣</option>
          </select>
        </div>
        <div class="form-group"><label>關鍵字 <span style="font-size:.75rem;color:#a08085">（用逗號分隔，例：拉麵,台南美食,必吃）</span></label><input type="text" id="edKeywords" placeholder="拉麵,台南美食,必吃"></div>
      </div>
      <div class="form-group"><label>摘要（顯示在列表頁）</label><textarea id="edSynopsis" rows="3" placeholder="一段簡短描述，吸引讀者點開…"></textarea></div>

      <!-- 封面圖 -->
      <div class="section-title">🖼️ 封面圖片</div>
      <div class="form-group">
        <label>封面圖 URL</label>
        <div class="cover-row">
          <input type="text" id="edCover" placeholder="https://... 或使用下方上傳/AI生成">
          <label class="upload-btn">📸 上傳圖片<input type="file" id="coverFileInput" accept="image/*" onchange="uploadIvyCover(event)"></label>
          <button class="ai-gen-btn" onclick="generateAICover()">✨ AI 生成封面</button>
        </div>
        <div id="coverPreviewWrap" style="margin-top:.5rem;display:none">
          <img id="coverPreview" style="max-width:220px;max-height:130px;object-fit:cover;border-radius:6px;border:1.5px solid #e0d4d5">
          <span id="coverUploadStatus" style="font-size:.78rem;margin-left:.5rem;color:#888"></span>
        </div>
      </div>

      <!-- 文章內文 -->
      <div class="section-title">📝 文章內文</div>
      <div class="form-group">
        <label>內文編輯器（支援富文本格式）</label>
        <div id="quillEditor"></div>
        <textarea id="edContent" style="display:none"></textarea>
      </div>

      <!-- 店家資料 -->
      <div class="section-title">🏪 店家資料（選填）</div>
      <div class="store-card">
        <div class="form-row">
          <div class="form-group"><label>店家名稱</label><input type="text" id="edStoreName" placeholder="例：一蘭拉麵 台南店"></div>
          <div class="form-group"><label>電話</label><input type="text" id="edStorePhone" placeholder="06-123-4567"></div>
        </div>
        <div class="form-group" style="margin-top:.8rem"><label>地址</label><input type="text" id="edStoreAddress" placeholder="台南市中西區..."></div>
        <div class="form-group" style="margin-top:.8rem"><label>營業時間</label><input type="text" id="edStoreHours" placeholder="週一至週五 11:00-21:00，週末 10:00-22:00"></div>
      </div>

      <!-- SEO -->
      <div class="section-title">🔍 SEO 設定</div>
      <div class="form-row">
        <div class="form-group"><label>SEO 標題（選填，不填用文章標題）</label><input type="text" id="edMetaT" placeholder="SEO 用標題"></div>
        <div class="form-group"><label>SEO 描述（選填）</label><input type="text" id="edMetaD" placeholder="搜尋引擎顯示的描述文字"></div>
      </div>

// ── AI 生成封面 ──
let aiGeneratedUrl = '';
async function generateAICover() {
  const title = document.getElementById('edTitleInput').value.trim();
  const synopsis = document.getElementById('edSynopsis').value.trim();
  const city = document.getElementById('edCity').value;
  const keywords = document.getElementById('edKeywords').value.trim();
  const catEl = document.getElementById('edCat');
  const catName = catEl.options[catEl.selectedIndex]?.text?.replace(/^[^a-zA-Z\u4e00-\u9fff]*/,'') || '';
  if (!title) { toast('請先填寫文章標題再生成封面', 1); return; }

  const prompt = `請根據以下文章資訊，用繁體中文生成一段封面圖的詳細視覺描述（英文），用於 AI 圖片生成：
文章標題：${title}
分類：${catName}
城市：${city || '台灣'}
關鍵字：${keywords}
摘要：${synopsis}
要求：溫暖、有質感、適合生活旅遊部落格，色調以粉橙暖色為主，構圖簡潔。請直接輸出英文圖片描述，不要其他說明。`;

  document.getElementById('aiOverlay').classList.add('show');
  document.getElementById('aiStatus').textContent = '🤖 正在呼叫 Claude AI 分析文章內容…';
  document.getElementById('aiBar').style.width = '20%';
  document.getElementById('aiPreviewImg').style.display = 'none';
  document.getElementById('aiUseBtn').style.display = 'none';

  try {
    // Step 1: 用 Claude API 生成圖片描述
    const aiResp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 300,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const aiData = await aiResp.json();
    const imgDesc = aiData.content?.[0]?.text || title;
    document.getElementById('aiStatus').textContent = '🎨 AI 描述生成完成，正在以 Canvas 合成封面…';
    document.getElementById('aiBar').style.width = '60%';
    document.getElementById('edAiPrompt').value = imgDesc.substring(0, 200);

    // Step 2: 用 canvas 根據描述合成精美封面
    const canvas = document.createElement('canvas');
    canvas.width = 1200; canvas.height = 630;
    const ctx = canvas.getContext('2d');

    // 根據分類決定色彩
    const catColors = {
      '美食餐廳': ['#ff9a9e','#ffecd2','#ff6b6b'],
      '飯店民宿': ['#a18cd1','#fbc2eb','#7b68ee'],
      '醫學美容': ['#fccb90','#d57eeb','#e040fb'],
      '汽車美容': ['#4facfe','#00f2fe','#1976d2'],
      '全身按摩': ['#84fab0','#8fd3f4','#26a69a'],
      '宅修清潔': ['#f093fb','#f5576c','#e91e63'],
      '設計推薦': ['#4facfe','#43e97b','#2196f3'],
    };
    const colors = catColors[catName] || ['#f8a5c2','#fde8d8','#d4697a'];

    // 漸層背景
    const grad = ctx.createLinearGradient(0, 0, 1200, 630);
    grad.addColorStop(0, colors[0]);
    grad.addColorStop(0.5, colors[1]);
    grad.addColorStop(1, colors[2]);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 1200, 630);

    // 裝飾圓
    ctx.globalAlpha = 0.15;
    ctx.fillStyle = 'white';
    ctx.beginPath(); ctx.arc(1050, 100, 200, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(150, 520, 150, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;

    // 半透明遮罩
    const overlay = ctx.createLinearGradient(0, 200, 0, 630);
    overlay.addColorStop(0, 'rgba(0,0,0,0)');
    overlay.addColorStop(1, 'rgba(0,0,0,0.45)');
    ctx.fillStyle = overlay;
    ctx.fillRect(0, 0, 1200, 630);

    // IvyLife 品牌標記
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.font = 'bold 28px Georgia, serif';
    ctx.fillText('IvyLife', 60, 68);
    ctx.font = 'italic 20px Georgia, serif';
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText('艾薇生活', 60, 95);

    // 分類標籤
    if (catName) {
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.beginPath(); ctx.roundRect(60, 130, catName.length*22+40, 38, 19); ctx.fill();
      ctx.fillStyle = 'white';
      ctx.font = '18px "Noto Sans TC", sans-serif';
      ctx.fillText(catName, 80, 155);
    }

    // 城市標籤
    if (city) {
      const cityX = 60 + (catName ? catName.length*22+60 : 0);
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.beginPath(); ctx.roundRect(cityX, 130, city.length*18+30, 38, 19); ctx.fill();
      ctx.fillStyle = 'white';
      ctx.font = '17px "Noto Sans TC", sans-serif';
      ctx.fillText('📍 ' + city, cityX+15, 155);
    }

    // 主標題
    ctx.fillStyle = 'white';
    ctx.shadowColor = 'rgba(0,0,0,0.4)';
    ctx.shadowBlur = 12;
    const maxW = 1080;
    const words = title.split('');
    let line = '', lines = [];
    for (const ch of words) {
      const test = line + ch;
      ctx.font = 'bold 62px "Noto Sans TC", sans-serif';
      if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = ch; }
      else line = test;
    }
    lines.push(line);
    lines = lines.slice(0, 3);
    const lineH = 80;
    const startY = lines.length === 1 ? 380 : lines.length === 2 ? 340 : 300;
    lines.forEach((l, i) => {
      ctx.font = 'bold 62px "Noto Sans TC", sans-serif';
      ctx.fillText(l, 60, startY + i * lineH);
    });

    // 摘要
    if (synopsis) {
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.font = '24px "Noto Sans TC", sans-serif';
      const sumShort = synopsis.substring(0, 40) + (synopsis.length > 40 ? '…' : '');
      ctx.fillText(sumShort, 60, startY + lines.length * lineH + 20);
    }

    // 關鍵字標籤
    if (keywords) {
      const tags = keywords.split(',').slice(0, 4);
      let tagX = 60;
      tags.forEach(tag => {
        tag = tag.trim();
        if (!tag) return;
        const tw = ctx.measureText(tag).width + 30;
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.beginPath(); ctx.roundRect(tagX, 570, tw, 34, 17); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.font = '15px "Noto Sans TC", sans-serif';
        ctx.fillText('# ' + tag, tagX + 12, 592);
        tagX += tw + 12;
      });
    }

    // 上傳到 Supabase
    document.getElementById('aiStatus').textContent = '☁️ 正在上傳封面至 Supabase Storage…';
    document.getElementById('aiBar').style.width = '80%';

    const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.92));
    const fname = 'ai-cover-' + Date.now() + '.jpg';
    const uploadR = await fetch(SB + '/storage/v1/object/ivy-images/' + fname, {
      method: 'POST', headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'image/jpeg' }, body: blob
    });
    if (!uploadR.ok) throw new Error(await uploadR.text());

    aiGeneratedUrl = SB + '/storage/v1/object/public/ivy-images/' + fname;
    document.getElementById('aiBar').style.width = '100%';
    document.getElementById('aiStatus').textContent = '✅ 封面生成完成！';
    document.getElementById('aiPreviewImg').src = aiGeneratedUrl;
    document.getElementById('aiPreviewImg').style.display = 'block';
    document.getElementById('aiUseBtn').style.display = 'inline-block';

  } catch(err) {
    document.getElementById('aiStatus').textContent = '❌ 生成失敗: ' + err.message.substring(0,60);
    console.error('AI cover err:', err);
  }
}

function useAICover() {
  if (!aiGeneratedUrl) return;
  document.getElementById('edCover').value = aiGeneratedUrl;
  document.getElementById('coverPreview').src = aiGeneratedUrl;
  document.getElementById('coverPreviewWrap').style.display = 'block';
  document.getElementById('coverUploadStatus').textContent = '✅ AI 生成封面已套用';
  closeAIOverlay();
  toast('✅ AI 封面已套用！');
}

}

function showPanel(name, el) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.sidebar-menu a').forEach(a => a.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  if (el) el.classList.add('active');
}
function toast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.background = isErr ? '#e74c3c' : '#2d2020';
  t.classList.add('show'); clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}
function badge(pub) { return pub ? '<span class="badge badge-green">已發布</span>' : '<span class="badge badge-gray">草稿</span>'; }
function fmtDate(s) { return s ? new Date(s).toLocaleDateString('zh-TW') : '-'; }
function esc(s) { return s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') : ''; }
</script>
</body>
