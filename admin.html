<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>IvyLife 後台管理</title>
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--rose:#c8566a;--rose-light:#f2a5b0;--rose-pale:#fff0f2;--gold:#c99960;--dark:#2d2020;--gray:#a08085;--bg:#f8f4f5;--green:#27ae60;--red:#e74c3c;--border:rgba(200,86,106,0.15)}
body{font-family:'Noto Sans TC',system-ui,sans-serif;background:var(--bg);color:var(--dark);min-height:100vh}
#loginPage{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#fff0f2,#fde8d8)}
.login-box{background:white;border-radius:20px;padding:2.5rem;width:360px;box-shadow:0 12px 48px rgba(200,86,106,0.12);text-align:center}
.ivy-logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:0.3rem}
.ivy-logo svg{width:44px;height:44px}
.logo-txt{font-size:1.6rem;font-weight:700;letter-spacing:-0.5px}
.logo-txt .ivy{color:var(--rose)}
.logo-txt .life{color:var(--gold);font-style:italic}
.login-sub{color:var(--gray);font-size:0.82rem;margin-bottom:1.8rem}
.login-box input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:0.92rem;margin-bottom:1rem;outline:none;font-family:inherit;transition:border-color 0.2s}
.login-box input:focus{border-color:var(--rose)}
.btn-primary{width:100%;padding:12px;background:linear-gradient(135deg,var(--rose),#e07a8a);color:white;border:none;border-radius:50px;font-size:0.95rem;cursor:pointer;font-weight:500;transition:opacity 0.2s}
.btn-primary:hover{opacity:0.88}
.login-err{color:var(--rose);font-size:0.82rem;margin-top:0.5rem;display:none}
#adminPage{display:none;min-height:100vh}
.sidebar{position:fixed;left:0;top:0;width:230px;height:100vh;background:var(--dark);color:white;padding:1.5rem 0;z-index:10;display:flex;flex-direction:column}
.sb-logo{padding:0 1.5rem 1.2rem;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;gap:10px}
.sb-logo svg{width:32px;height:32px}
.sb-logo-txt{font-size:1.1rem;font-weight:700}
.sb-logo-txt .ivy{color:var(--rose-light)}
.sb-logo-txt .life{color:var(--gold);font-style:italic}
.sb-menu{list-style:none;padding:0.8rem 0;flex:1}
.sb-menu li a{display:flex;align-items:center;gap:0.7rem;padding:0.65rem 1.5rem;color:rgba(255,255,255,0.65);text-decoration:none;font-size:0.87rem;transition:all 0.2s;cursor:pointer}
.sb-menu li a:hover,.sb-menu li a.active{background:rgba(242,165,176,0.15);color:white}
.sb-foot{padding:1rem 1.5rem;border-top:1px solid rgba(255,255,255,0.08)}
.sb-foot button{width:100%;padding:8px;background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.6);border:none;border-radius:8px;cursor:pointer;font-size:0.82rem;transition:all 0.2s}
.sb-foot button:hover{background:rgba(255,255,255,0.15);color:white}
.main{margin-left:230px;padding:2rem;min-height:100vh}
.page-hdr{margin-bottom:1.8rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem}
.page-hdr h1{font-size:1.35rem;font-weight:500}
.btn{padding:8px 20px;border-radius:50px;font-size:0.85rem;cursor:pointer;border:none;transition:all 0.2s;font-family:inherit}
.btn-rose{background:linear-gradient(135deg,var(--rose),#e07a8a);color:white}
.btn-rose:hover{opacity:0.88}
.btn-outline{background:transparent;color:var(--rose);border:1.5px solid var(--rose)}
.btn-outline:hover{background:var(--rose-pale)}
.btn-sm{padding:5px 14px;font-size:0.78rem}
.btn-danger{background:var(--red);color:white}
.btn-success{background:var(--green);color:white}
.btn-gold{background:linear-gradient(135deg,var(--gold),#e0b070);color:white}
.btn-gold:hover{opacity:0.88}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:2rem}
.stat-card{background:white;border-radius:14px;padding:1.2rem 1.5rem;border:1px solid var(--border)}
.stat-num{font-size:2rem;font-weight:500;color:var(--rose)}
.stat-lbl{font-size:0.8rem;color:var(--gray);margin-top:0.2rem}
.card{background:white;border-radius:14px;border:1px solid var(--border);overflow:hidden;margin-bottom:1.5rem}
.card-hdr{padding:1rem 1.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-size:0.9rem;font-weight:500}
table{width:100%;border-collapse:collapse;font-size:0.84rem}
th{padding:0.7rem 1.2rem;text-align:left;background:#fdf8f4;color:var(--gray);font-weight:400;font-size:0.77rem;text-transform:uppercase;letter-spacing:0.05em;white-space:nowrap}
td{padding:0.75rem 1.2rem;border-top:1px solid var(--border);vertical-align:middle}
tr:hover td{background:#fdf8f4}
.badge{display:inline-block;padding:2px 10px;border-radius:50px;font-size:0.72rem}
.badge-green{background:#e8f5e9;color:#2e7d32}
.badge-gray{background:#f5f5f5;color:#757575}
.actions{display:flex;gap:0.4rem;flex-wrap:wrap}
.toolbar{display:flex;gap:0.8rem;margin-bottom:1rem;flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select{padding:8px 14px;border:1.5px solid var(--border);border-radius:50px;font-size:0.85rem;outline:none;font-family:inherit;background:white}
.toolbar input:focus,.toolbar select:focus{border-color:var(--rose)}
.toolbar input{min-width:200px}
.eform{padding:1.5rem;display:flex;flex-direction:column;gap:1.2rem}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.fgrp{display:flex;flex-direction:column;gap:0.4rem}
.fgrp label{font-size:0.82rem;color:var(--gray)}
.fgrp label span{color:var(--rose)}
.fgrp input,.fgrp select,.fgrp textarea{padding:9px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:0.9rem;font-family:inherit;outline:none;transition:border-color 0.2s;background:white;color:var(--dark)}
.fgrp input:focus,.fgrp select:focus,.fgrp textarea:focus{border-color:var(--rose);box-shadow:0 0 0 3px rgba(200,86,106,0.08)}
.fgrp textarea{min-height:100px;resize:vertical;line-height:1.7}
.factions{display:flex;gap:0.8rem;padding-top:0.5rem;flex-wrap:wrap}
.sec-title{font-size:0.82rem;font-weight:600;color:var(--rose);text-transform:uppercase;letter-spacing:0.08em;padding:0.8rem 0 0.4rem;border-top:1px solid var(--border);margin-top:0.5rem}
.cover-area{display:flex;gap:0.6rem;align-items:flex-start;flex-wrap:wrap}
.cover-area input[type=text]{flex:1;min-width:200px}
.cover-btns{display:flex;gap:0.5rem;flex-shrink:0}
#coverPreviewWrap{margin-top:0.5rem;display:none;align-items:center;gap:0.8rem}
#coverPreview{max-width:240px;max-height:135px;object-fit:cover;border-radius:8px;border:1px solid var(--border)}
#coverUploadStatus{font-size:0.78rem;color:var(--gray)}
.ai-gen{display:none;align-items:center;gap:0.5rem;font-size:0.82rem;color:var(--rose);margin-top:0.4rem}
.spinner{width:16px;height:16px;border:2px solid var(--rose-pale);border-top-color:var(--rose);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ql-container{font-size:0.9rem;font-family:inherit;border-radius:0 0 10px 10px;border-color:var(--border)!important}
.ql-toolbar{border-radius:10px 10px 0 0;border-color:var(--border)!important;background:#fdf8f4}
.ql-editor{min-height:260px;line-height:1.8}
.store-sec{background:var(--rose-pale);border-radius:12px;padding:1.2rem;border:1px solid var(--border)}
.store-sec h3{font-size:0.9rem;font-weight:600;color:var(--rose);margin-bottom:0.8rem}
.toast{position:fixed;bottom:2rem;right:2rem;padding:12px 20px;background:var(--dark);color:white;border-radius:10px;font-size:0.85rem;z-index:999;opacity:0;transition:opacity 0.3s;pointer-events:none;max-width:320px}
.toast.show{opacity:1}
.panel{display:none}.panel.active{display:block}
.empty-state{text-align:center;padding:3rem;color:var(--gray);font-size:0.9rem}
.check-row{display:flex;align-items:center;gap:0.5rem}
.check-row input[type=checkbox]{width:16px;height:16px;cursor:pointer;accent-color:var(--rose)}
.check-row label{font-size:0.9rem;cursor:pointer}
.tag-wrap{display:flex;flex-wrap:wrap;gap:0.4rem;padding:8px 10px;border:1.5px solid var(--border);border-radius:10px;background:white;cursor:text;min-height:42px;align-items:center}
.tag-wrap:focus-within{border-color:var(--rose);box-shadow:0 0 0 3px rgba(200,86,106,0.08)}
.tag-item{display:inline-flex;align-items:center;gap:4px;background:var(--rose-pale);color:var(--rose);padding:2px 10px;border-radius:50px;font-size:0.78rem;white-space:nowrap}
.tag-item button{background:none;border:none;cursor:pointer;color:var(--rose);font-size:0.9rem;line-height:1;padding:0}
.tag-input{border:none;outline:none;font-family:inherit;font-size:0.85rem;color:var(--dark);min-width:120px;background:transparent}
@media(max-width:768px){.stats-grid{grid-template-columns:repeat(2,1fr)}.frow{grid-template-columns:1fr}.sidebar{width:180px}.main{margin-left:180px}}
</style>
</head>
<body>
<div id="loginPage">
<div class="login-box">
  <div class="ivy-logo">
    <svg viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="22" cy="22" r="21" fill="#fff0f2" stroke="#c8566a" stroke-width="1.5"/>
      <path d="M22 36C22 36 10 28 10 19C10 13.477 15.477 9 22 9C28.523 9 34 13.477 34 19C34 28 22 36 22 36Z" fill="#f2a5b0" opacity="0.5"/>
      <path d="M22 8C22 8 14 14 14 22C14 26 17.5 30 22 32C26.5 30 30 26 30 22C30 14 22 8 22 8Z" fill="#c8566a" opacity="0.85"/>
      <ellipse cx="19" cy="20" rx="4.5" ry="6" transform="rotate(-20 19 20)" fill="white" opacity="0.6"/>
      <ellipse cx="25" cy="18" rx="3.5" ry="5" transform="rotate(15 25 18)" fill="white" opacity="0.4"/>
      <path d="M22 32V38" stroke="#c99960" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <div class="logo-txt"><span class="ivy">Ivy</span><span class="life">Life</span></div>
  </div>
  <div class="login-sub">後台管理系統</div>
  <input type="password" id="pwInput" placeholder="請輸入管理員密碼">
  <button class="btn-primary" onclick="doLogin()">登入</button>
  <div class="login-err" id="loginErr">密碼錯誤，請再試一次</div>
</div>
</div>
<div id="adminPage">
<nav class="sidebar">
  <div class="sb-logo">
    <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M16 28C16 28 6 22 6 14C6 9 10.477 5 16 5C21.523 5 26 9 26 14C26 22 16 28 16 28Z" fill="#f2a5b0" opacity="0.4"/>
      <path d="M16 4C16 4 10 9 10 16C10 19.5 12.5 23 16 24.5C19.5 23 22 19.5 22 16C22 9 16 4 16 4Z" fill="#f2a5b0"/>
      <ellipse cx="14" cy="15" rx="3" ry="4.5" transform="rotate(-20 14 15)" fill="white" opacity="0.5"/>
    </svg>
    <div class="sb-logo-txt"><span class="ivy">Ivy</span><span class="life">Life</span> 後台</div>
  </div>
  <ul class="sb-menu">
    <li><a class="active" onclick="showPanel('dashboard',this)">📊 總覽</a></li>
    <li><a onclick="showPanel('articles',this)">📝 文章管理</a></li>
    <li><a onclick="showPanel('new',this);resetForm()">✏️ 新增文章</a></li>
    <li><a onclick="showPanel('categories',this)">🏷️ 分類管理</a></li>
  </ul>
  <div class="sb-foot"><button onclick="window.open('/','_blank')">↗ 前往前台</button></div>
</nav>
<main class="main">
<div id="panel-dashboard" class="panel active">
  <div class="page-hdr"><h1>📊 網站總覽</h1><span style="font-size:0.8rem;color:var(--gray)" id="lastUpdate"></span></div>
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-num" id="s1">-</div><div class="stat-lbl">全部文章</div></div>
    <div class="stat-card"><div class="stat-num" id="s2">-</div><div class="stat-lbl">已發布</div></div>
    <div class="stat-card"><div class="stat-num" id="s3">-</div><div class="stat-lbl">草稿</div></div>
    <div class="stat-card"><div class="stat-num" id="s4">-</div><div class="stat-lbl">分類數</div></div>
  </div>
  <div class="card">
    <div class="card-hdr">最新 10 篇文章<button class="btn btn-sm btn-rose" onclick="showPanel('new',document.querySelector('.sb-menu li:nth-child(3) a'));resetForm()">+ 新增</button></div>
    <table><thead><tr><th>標題</th><th>分類</th><th>縣市</th><th>狀態</th><th>日期</th></tr></thead><tbody id="dashRecent"></tbody></table>
  </div>
</div>
<div id="panel-articles" class="panel">
  <div class="page-hdr"><h1>📝 文章管理</h1><button class="btn btn-rose" onclick="showPanel('new',document.querySelector('.sb-menu li:nth-child(3) a'));resetForm()">+ 新增文章</button></div>
  <div class="toolbar">
    <input type="text" id="searchQ" placeholder="搜尋標題或 slug…" oninput="filterList()">
    <select id="filterCat" onchange="filterList()"><option value="">全部分類</option></select>
    <select id="filterCity" onchange="filterList()">
      <option value="">全部縣市</option>
      <option>台北市</option><option>新北市</option><option>桃園市</option><option>台中市</option><option>台南市</option><option>高雄市</option>
      <option>新竹市</option><option>新竹縣</option><option>苗栗縣</option><option>彰化縣</option><option>南投縣</option><option>雲林縣</option>
      <option>嘉義市</option><option>嘉義縣</option><option>屏東縣</option><option>宜蘭縣</option><option>花蓮縣</option><option>台東縣</option>
      <option>澎湖縣</option><option>金門縣</option><option>連江縣</option>
    </select>
    <select id="filterPub" onchange="filterList()"><option value="">全部狀態</option><option value="true">已發布</option><option value="false">草稿</option></select>
  </div>
  <div class="card"><table><thead><tr><th>標題</th><th>分類</th><th>縣市</th><th>Slug</th><th>狀態</th><th>日期</th><th>操作</th></tr></thead><tbody id="artList"></tbody></table></div>
</div>
<div id="panel-new" class="panel">
  <div class="page-hdr"><h1 id="edTitle">✏️ 新增文章</h1><button class="btn btn-outline" onclick="resetForm()">× 取消</button></div>
  <div class="card"><div class="eform">
    <input type="hidden" id="edId">
    <div class="fgrp"><label>文章標題 <span>*</span></label><input type="text" id="edTitleInput" placeholder="例：台南必吃美食推薦｜艾薇精選10家私藏餐廳"></div>
    <div class="frow">
      <div class="fgrp"><label>Slug（網址）<span>*</span> <span style="color:var(--gold);font-size:0.75rem">— 英文小寫+數字，如 tastyfood01</span></label><input type="text" id="edSlug" placeholder="tastyfood01"></div>
      <div class="fgrp"><label>分類</label><select id="edCat"><option value="">-- 選擇分類 --</option></select></div>
    </div>
    <div class="frow">
      <div class="fgrp">
        <label>縣市</label>
        <select id="edCity">
          <option value="">-- 選擇縣市 --</option>
          <option>台北市</option><option>新北市</option><option>桃園市</option><option>台中市</option><option>台南市</option><option>高雄市</option>
          <option>新竹市</option><option>新竹縣</option><option>苗栗縣</option><option>彰化縣</option><option>南投縣</option><option>雲林縣</option>
          <option>嘉義市</option><option>嘉義縣</option><option>屏東縣</option><option>宜蘭縣</option><option>花蓮縣</option><option>台東縣</option>
          <option>澎湖縣</option><option>金門縣</option><option>連江縣</option>
        </select>
      </div>
      <div class="fgrp">
        <label>關鍵字 <span style="color:var(--gray);font-size:0.75rem">（Enter 新增）</span></label>
        <div class="tag-wrap" id="tagWrap" onclick="document.getElementById('tagInput').focus()">
          <input type="text" id="tagInput" class="tag-input" placeholder="輸入關鍵字後按 Enter">
        </div>
        <input type="hidden" id="edKeywords">
      </div>
    </div>
    <div class="sec-title">🖼️ 封面圖片</div>
    <div class="fgrp">
      <label>封面圖</label>
      <div class="cover-area">
        <input type="text" id="edCover" placeholder="https://... 或使用下方按鈕上傳／AI生成">
        <div class="cover-btns">
          <label style="cursor:pointer;background:var(--rose);color:#fff;padding:0.45rem 0.9rem;border-radius:8px;font-size:0.82rem;white-space:nowrap;user-select:none">📸 上傳圖片<input type="file" id="coverFileInput" accept="image/*" style="display:none" onchange="uploadIvyCover(event)"></label>
          <button class="btn btn-gold btn-sm" onclick="generateAICover()" id="aiCoverBtn">✨ AI 生成封面</button>
        </div>
      </div>
      <div id="aiGen" class="ai-gen"><div class="spinner"></div>AI 正在生成封面圖...</div>
      <div id="coverPreviewWrap" style="display:none;margin-top:0.5rem;align-items:center;gap:0.8rem">
        <img id="coverPreview" style="max-width:240px;max-height:135px;object-fit:cover;border-radius:8px;border:1px solid var(--border)">
        <span id="coverUploadStatus" style="font-size:0.78rem;color:var(--gray)"></span>
      </div>
    </div>
    <div class="fgrp"><label>摘要（顯示在列表頁）</label><textarea id="edSynopsis" rows="3" placeholder="一段簡短描述，吸引讀者點開…"></textarea></div>
    <div class="sec-title">📄 文章內文</div>
    <div class="fgrp"><label>內文（富文本編輯器）</label><div id="quillEditor"></div><input type="hidden" id="edContent"></div>
    <div class="sec-title">🏪 店家資訊</div>
    <div class="store-sec">
      <h3>📍 店家基本資料（選填）</h3>
      <div class="frow">
        <div class="fgrp"><label>店家名稱</label><input type="text" id="edStoreName" placeholder="例：好食餐廳"></div>
        <div class="fgrp"><label>電話</label><input type="text" id="edStorePhone" placeholder="例：06-123-4567"></div>
      </div>
      <div class="fgrp"><label>地址</label><input type="text" id="edStoreAddress" placeholder="例：台南市中西區民生路一段123號"></div>
      <div class="frow">
        <div class="fgrp"><label>營業時間</label><input type="text" id="edStoreHours" placeholder="例：週一至週日 11:00–21:00"></div>
        <div class="fgrp"><label>AI 封面提示（選填）</label><input type="text" id="edAiPrompt" placeholder="例：台南美食 南瓜濃湯 溫馨餐廳氛圍"></div>
      </div>
    </div>
    <div class="sec-title">🔍 SEO 設定</div>
    <div class="frow">
      <div class="fgrp"><label>SEO 標題（選填）</label><input type="text" id="edMetaT" placeholder="SEO 用標題"></div>
      <div class="fgrp"><label>SEO 描述（選填）</label><input type="text" id="edMetaD" placeholder="搜尋結果顯示的描述文字"></div>
    </div>
    <div class="check-row"><input type="checkbox" id="edPub" checked><label for="edPub">立刻發布（取消勾選則存為草稿）</label></div>
    <div class="factions">
      <button class="btn btn-rose" onclick="saveArt()">💾 儲存文章</button>
      <button class="btn btn-outline" onclick="resetForm()">取消</button>
    </div>
  </div></div>
</div>
<div id="panel-categories" class="panel">
  <div class="page-hdr"><h1>🏷️ 分類管理</h1><span style="font-size:0.82rem;color:var(--gray)">分類目前需透過 Supabase 管理</span></div>
  <div class="card"><table><thead><tr><th>圖示</th><th>名稱</th><th>Slug</th><th>說明</th><th>排序</th><th>文章數</th></tr></thead><tbody id="catList"></tbody></table></div>
</div>
</main></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
<script>
const SB='https://zsebcpfblecwumbaxeaz.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpzZWJjcGZibGVjd3VtYmF4ZWF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3OTUzMjcsImV4cCI6MjA4OTM3MTMyN30.g0rsqNO6cItp8Qw3ybveVwX2afjTSwtS7WFHL_320jQ';
const PASS='ivy2024admin';
let arts=[],cats=[],quill;

function initQuill(){if(quill)return;quill=new Quill('#quillEditor',{theme:'snow',placeholder:'在此輸入文章內文，支援標題、粗體、清單、連結等…',modules:{toolbar:[[{header:[2,3,false]}],['bold','italic','underline','strike'],[{color:[]},{background:[]}],[{list:'ordered'},{list:'bullet'}],['blockquote','code-block'],['link','image'],['clean']]}});}

function doLogin(){
  if(document.getElementById('pwInput').value===PASS){
    document.getElementById('loginPage').style.display='none';
    document.getElementById('adminPage').style.display='block';
    initQuill();loadAll();
  }else{document.getElementById('loginErr').style.display='block';}
}
document.getElementById('pwInput').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

async function sb(path,opt){
  opt=opt||{};
  const r=await fetch(SB+'/rest/v1/'+path,Object.assign({},opt,{headers:Object.assign({'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':'return=representation'},opt.headers||{})}));
  if(!r.ok){const e=await r.text();throw new Error(e);}
  try{return await r.json();}catch{return[];}
}

async function loadAll(){
  try{
    [cats,arts]=await Promise.all([sb('ivy_categories?order=sort_order.asc'),sb('ivy_articles?select=*,ivy_categories(name,slug)&order=created_at.desc')]);
    renderDash();renderArts(arts);renderCats();fillCatOpts();
    document.getElementById('lastUpdate').textContent='更新於 '+new Date().toLocaleTimeString('zh-TW');
  }catch(e){toast('載入失敗：'+e.message,1);}
}

function renderDash(){
  document.getElementById('s1').textContent=arts.length;
  document.getElementById('s2').textContent=arts.filter(a=>a.published).length;
  document.getElementById('s3').textContent=arts.filter(a=>!a.published).length;
  document.getElementById('s4').textContent=cats.length;
  document.getElementById('dashRecent').innerHTML=arts.slice(0,10).map(a=>'<tr><td><strong>'+esc(a.title)+'</strong></td><td>'+(a.ivy_categories?a.ivy_categories.name:'-')+'</td><td>'+(a.city||'-')+'</td><td>'+badge(a.published)+'</td><td>'+fmtDate(a.created_at)+'</td></tr>').join('')||'<tr><td colspan="5" class="empty-state">暫無文章</td></tr>';
}

function renderArts(list){
  document.getElementById('artList').innerHTML=list.map(a=>'<tr><td><strong>'+esc(a.title)+'</strong></td><td>'+(a.ivy_categories?a.ivy_categories.name:'-')+'</td><td>'+(a.city||'-')+'</td><td><code style="font-size:0.75rem;color:var(--gray)">'+a.slug+'</code></td><td>'+badge(a.published)+'</td><td>'+fmtDate(a.created_at)+'</td><td><div class="actions"><button class="btn btn-sm btn-outline" onclick="editArt('+a.id+')">編輯</button><button class="btn btn-sm '+(a.published?'btn-outline':'btn-success')+'" onclick="togglePub('+a.id+','+a.published+')">'+(a.published?'下架':'發布')+'</button><button class="btn btn-sm btn-danger" onclick="delArt('+a.id+',''+a.title.replace(/'/g,'').substring(0,20)+'')">刪除</button></div></td></tr>').join('')||'<tr><td colspan="7" class="empty-state">暫無文章</td></tr>';
}

function renderCats(){
  document.getElementById('catList').innerHTML=cats.map(c=>{const cnt=arts.filter(a=>a.category_id===c.id).length;return '<tr><td style="font-size:1.4rem">'+(c.icon||'')+'</td><td><strong>'+c.name+'</strong></td><td><code>'+c.slug+'</code></td><td style="color:var(--gray)">'+(c.description||'')+'</td><td style="text-align:center">'+c.sort_order+'</td><td style="text-align:center"><strong>'+cnt+'</strong></td></tr>';}).join('');
}

function fillCatOpts(){
  const opts=cats.map(c=>'<option value="'+c.id+'">'+(c.icon||'')+' '+c.name+'</option>').join('');
  document.getElementById('edCat').innerHTML='<option value="">-- 選擇分類 --</option>'+opts;
  document.getElementById('filterCat').innerHTML='<option value="">全部分類</option>'+cats.map(c=>'<option value="'+c.id+'">'+c.name+'</option>').join('');
}

function filterList(){
  const q=document.getElementById('searchQ').value.toLowerCase();
  const cat=document.getElementById('filterCat').value;
  const city=document.getElementById('filterCity').value;
  const pub=document.getElementById('filterPub').value;
  let list=arts;
  if(q)list=list.filter(a=>a.title.toLowerCase().includes(q)||a.slug.includes(q));
  if(cat)list=list.filter(a=>String(a.category_id)===cat);
  if(city)list=list.filter(a=>a.city===city);
  if(pub!=='')list=list.filter(a=>String(a.published)===pub);
  renderArts(list);
}

function getTags(){return Array.from(document.querySelectorAll('.tag-item')).map(t=>t.dataset.val);}
function addTag(val){
  val=val.trim();if(!val||getTags().includes(val))return;
  const wrap=document.getElementById('tagWrap'),inp=document.getElementById('tagInput');
  const span=document.createElement('span');span.className='tag-item';span.dataset.val=val;
  span.innerHTML=val+'<button onclick="this.parentElement.remove();updateKw()">×</button>';
  wrap.insertBefore(span,inp);inp.value='';updateKw();
}
function updateKw(){document.getElementById('edKeywords').value=getTags().join(',');}
function setTags(str){
  const wrap=document.getElementById('tagWrap'),inp=document.getElementById('tagInput');
  wrap.querySelectorAll('.tag-item').forEach(t=>t.remove());
  if(str)str.split(',').filter(Boolean).forEach(addTag);
}
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('tagInput').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===','){e.preventDefault();addTag(e.target.value);}});
});

function editArt(id){
  const a=arts.find(x=>x.id===id);if(!a)return;
  ['edId','edTitleInput','edSlug','edSynopsis','edCover','edMetaT','edMetaD','edStoreName','edStorePhone','edStoreAddress','edStoreHours','edAiPrompt'].forEach(k=>document.getElementById(k).value=a[k.replace('ed','').replace(/([A-Z])/g,c=>'_'+c.toLowerCase()).replace('_id','id').replace('_title_input','title').replace('_slug','slug').replace('_synopsis','synopsis').replace('_cover','cover_image').replace('_meta_t','meta_title').replace('_meta_d','meta_description').replace('_store_name','store_name').replace('_store_phone','store_phone').replace('_store_address','store_address').replace('_store_hours','store_hours').replace('_ai_prompt','ai_cover_prompt')]||'');
  document.getElementById('edId').value=a.id;
  document.getElementById('edTitleInput').value=a.title||'';
  document.getElementById('edSlug').value=a.slug||'';
  document.getElementById('edCat').value=a.category_id||'';
  document.getElementById('edCity').value=a.city||'';
  document.getElementById('edSynopsis').value=a.synopsis||'';
  document.getElementById('edCover').value=a.cover_image||'';
  document.getElementById('edMetaT').value=a.meta_title||'';
  document.getElementById('edMetaD').value=a.meta_description||'';
  document.getElementById('edStoreName').value=a.store_name||'';
  document.getElementById('edStorePhone').value=a.store_phone||'';
  document.getElementById('edStoreAddress').value=a.store_address||'';
  document.getElementById('edStoreHours').value=a.store_hours||'';
  document.getElementById('edAiPrompt').value=a.ai_cover_prompt||'';
  document.getElementById('edPub').checked=!!a.published;
  setTags(a.keywords||'');
  if(quill)quill.root.innerHTML=a.content||'';
  if(a.cover_image){document.getElementById('coverPreview').src=a.cover_image;document.getElementById('coverPreviewWrap').style.display='flex';}
  document.getElementById('edTitle').textContent='✏️ 編輯文章';
  showPanel('new',document.querySelector('.sb-menu li:nth-child(3) a'));window.scrollTo(0,0);
}

function resetForm(){
  document.getElementById('edId').value='';
  ['edTitleInput','edSlug','edSynopsis','edCover','edMetaT','edMetaD','edStoreName','edStorePhone','edStoreAddress','edStoreHours','edAiPrompt'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('edCat').value='';document.getElementById('edCity').value='';
  document.getElementById('edPub').checked=true;setTags('');
  if(quill)quill.setText('');
  document.getElementById('coverPreviewWrap').style.display='none';
  document.getElementById('edTitle').textContent='✏️ 新增文章';
  showPanel('articles',document.querySelector('.sb-menu li:nth-child(2) a'));
}

async function saveArt(){
  const id=document.getElementById('edId').value;
  const title=document.getElementById('edTitleInput').value.trim();
  const slug=document.getElementById('edSlug').value.trim().replace(/[^a-zA-Z0-9一-鿿-_]/g,'');
  if(!title){toast('請填寫文章標題',1);return;}
  if(!slug){toast('請填寫 Slug（網址）',1);return;}
  if(quill)document.getElementById('edContent').value=quill.root.innerHTML;
  const data={title,slug,synopsis:document.getElementById('edSynopsis').value.trim()||null,content:document.getElementById('edContent').value.trim()||null,category_id:document.getElementById('edCat').value||null,cover_image:document.getElementById('edCover').value.trim()||null,meta_title:document.getElementById('edMetaT').value.trim()||null,meta_description:document.getElementById('edMetaD').value.trim()||null,published:document.getElementById('edPub').checked,city:document.getElementById('edCity').value||null,keywords:document.getElementById('edKeywords').value||null,store_name:document.getElementById('edStoreName').value.trim()||null,store_phone:document.getElementById('edStorePhone').value.trim()||null,store_address:document.getElementById('edStoreAddress').value.trim()||null,store_hours:document.getElementById('edStoreHours').value.trim()||null,ai_cover_prompt:document.getElementById('edAiPrompt').value.trim()||null,updated_at:new Date().toISOString()};
  try{
    if(id){await sb('ivy_articles?id=eq.'+id,{method:'PATCH',body:JSON.stringify(data)});toast('✅ 文章已更新！');}
    else{await sb('ivy_articles',{method:'POST',body:JSON.stringify(data)});toast('✅ 文章已新增！');}
    await loadAll();resetForm();
  }catch(e){toast('儲存失敗：'+e.message,1);}
}

async function uploadIvyCover(e){
  const file=e.target.files?.[0];if(!file)return;
  const status=document.getElementById('coverUploadStatus'),preview=document.getElementById('coverPreview'),wrap=document.getElementById('coverPreviewWrap');
  preview.src=URL.createObjectURL(file);wrap.style.display='flex';
  status.textContent='⏳ 上傳中...';status.style.color='#888';
  const ext=file.name.split('.').pop()||'jpg';
  const fname='cover-'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;
  try{
    const r=await fetch(SB+'/storage/v1/object/ivy-images/'+fname,{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':file.type},body:file});
    if(!r.ok){const t=await r.text();throw new Error(t);}
    const url=SB+'/storage/v1/object/public/ivy-images/'+fname;
    document.getElementById('edCover').value=url;
    status.textContent='✅ 上傳成功';status.style.color='#4caf50';
  }catch(err){status.textContent='❌ '+err.message.substring(0,40);status.style.color='#f44336';}
  e.target.value='';
}

async function generateAICover(){
  const title=document.getElementById('edTitleInput').value.trim();
  const synopsis=document.getElementById('edSynopsis').value.trim();
  const customPrompt=document.getElementById('edAiPrompt').value.trim();
  const city=document.getElementById('edCity').value;
  const catId=document.getElementById('edCat').value;
  const catName=catId?(cats.find(c=>String(c.id)===catId)?.name||''):'';
  if(!title&&!customPrompt){toast('請先填寫文章標題再生成封面',1);return;}
  const btn=document.getElementById('aiCoverBtn'),gen=document.getElementById('aiGen');
  btn.disabled=true;gen.style.display='flex';toast('✨ AI 正在生成封面圖，請稍候…');
  const prompt=customPrompt||title+(city?' '+city:'')+(catName?' '+catName:'')+(synopsis?' '+synopsis.substring(0,60):'');
  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:2000,messages:[{role:'user',content:'請為以下文章生成精美封面圖 SVG（1200x630px）。
標題：'+title+'
分類：'+(catName||'生活風格')+'
縣市：'+(city||'台灣')+'
提示：'+prompt+'
要求：1.輸出純SVG代碼以<svg開頭</svg結尾 2.viewBox="0 0 1200 630" 3.玫瑰粉/珊瑚/金色系漸層背景 4.中央顯示文章標題中文字體48-56px白色 5.右下角分類名稱 6.左下角IvyLife品牌名稱 7.加入適合主題的裝飾性幾何或花卉圖案 8.只輸出SVG代碼不要說明'}]})});
    if(!resp.ok)throw new Error('API 請求失敗：'+resp.status);
    const data=await resp.json();
    const text=data.content?.[0]?.text||'';
    const svgMatch=text.match(/<svg[sS]*?</svg>/i);
    if(!svgMatch)throw new Error('未能取得 SVG 內容');
    const svgCode=svgMatch[0];
    const blob=new Blob([svgCode],{type:'image/svg+xml'});
    const fname='ai-cover-'+Date.now()+'.svg';
    const uploadResp=await fetch(SB+'/storage/v1/object/ivy-images/'+fname,{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'image/svg+xml'},body:blob});
    if(!uploadResp.ok){const t=await uploadResp.text();throw new Error(t);}
    const url=SB+'/storage/v1/object/public/ivy-images/'+fname;
    document.getElementById('edCover').value=url;
    const preview=document.getElementById('coverPreview'),wrap=document.getElementById('coverPreviewWrap'),status=document.getElementById('coverUploadStatus');
    preview.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svgCode);
    wrap.style.display='flex';status.textContent='✅ AI 封面已生成';status.style.color='#4caf50';
    toast('✅ AI 封面生成完成！');
  }catch(err){toast('AI 生成失敗：'+err.message.substring(0,60),1);console.error(err);}
  finally{btn.disabled=false;gen.style.display='none';}
}

async function togglePub(id,cur){
  try{await sb('ivy_articles?id=eq.'+id,{method:'PATCH',body:JSON.stringify({published:!cur})});toast(cur?'文章已下架':'✅ 文章已發布！');await loadAll();}
  catch(e){toast('操作失敗：'+e.message,1);}
}

async function delArt(id,title){
  if(!confirm('確定刪除「'+title+'…」？此動作無法還原。'))return;
  try{await sb('ivy_articles?id=eq.'+id,{method:'DELETE'});toast('文章已刪除');await loadAll();}
  catch(e){toast('刪除失敗：'+e.message,1);}
}

function showPanel(name,el){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.sb-menu a').forEach(a=>a.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
  if(el)el.classList.add('active');
}

function toast(msg,isErr){
  const t=document.getElementById('toast');t.textContent=msg;t.style.background=isErr?'#e74c3c':'#2d2020';
  t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),3000);
}
function badge(pub){return pub?'<span class="badge badge-green">已發布</span>':'<span class="badge badge-gray">草稿</span>';}
function fmtDate(s){return s?new Date(s).toLocaleDateString('zh-TW'):'-';}
function esc(s){return s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):''; }
</script>
</body>
</html>
