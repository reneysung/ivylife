<meta name="viewport" content="width=device-width,initial-scale=1.0">

<meta property="og:title" id="og-title" content="IvyLife">
<meta property="og:description" id="og-desc" content="">

<link rel="stylesheet" href="/css/style.css">
<style>
.art-wrap{max-width:780px;margin:0 auto;padding:2rem 1.5rem 4rem}
.art-keywords{display:flex;flex-wrap:wrap;gap:6px;margin-top:1.5rem}.art-kw-tag{background:#f9f0f2;color:#c8566a;border-radius:50px;padding:4px 12px;font-size:0.78rem;text-decoration:none}.art-kw-tag:hover{background:#c8566a;color:white}
.art-cover{width:100%;max-height:450px;object-fit:cover;border-radius:12px;margin-bottom:2rem;display:block}.yt-wrap{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;margin:1.2rem 0;border-radius:8px}.yt-iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
.art-cat-badge{display:inline-block;font-size:0.78rem;color:var(--rose-deep,#c9697a);font-weight:600;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:0.6rem;background:rgba(242,160,147,0.1);padding:0.2rem 0.7rem;border-radius:20px}
.art-title{font-family:var(--font-serif,serif);font-size:clamp(1.6rem,4vw,2.4rem);font-weight:600;line-height:1.3;margin-bottom:1rem;color:var(--text-dark,#2c2c2c)}
.art-meta{font-size:0.82rem;color:var(--text-light,#888);margin-bottom:1.5rem;display:flex;gap:1rem;flex-wrap:wrap;align-items:center}
.art-synopsis{font-size:1.05rem;line-height:1.8;color:var(--text,#555);border-left:3px solid var(--rose,#F2A093);padding-left:1rem;margin-bottom:2rem;font-style:italic}
.art-content{font-size:1rem;line-height:1.9;color:var(--text,#555)}
.art-content h2{font-family:var(--font-serif,serif);font-size:1.35rem;font-weight:600;margin:2rem 0 0.8rem;color:var(--text-dark,#2c2c2c)}
.art-content h3{font-size:1.15rem;font-weight:600;margin:1.5rem 0 0.6rem;color:var(--text-dark,#2c2c2c)}
.art-content p{margin-bottom:1.2rem}
.art-content img{width:100%;border-radius:8px;margin:1rem 0}
.art-back{display:inline-flex;align-items:center;gap:0.4rem;color:var(--rose-deep,#c9697a);text-decoration:none;font-size:0.85rem;margin-bottom:1.5rem;opacity:0.8}
.art-back:hover{opacity:1;text-decoration:underline}
.loading-state,.error-state{text-align:center;padding:4rem 2rem;color:var(--text-light,#888)}
.art-footer-line{border-top:1px solid var(--border,#eee);margin-top:3rem;padding-top:2rem;text-align:center;font-size:0.85rem;color:var(--text-light,#888)}
.art-wrap img{max-width:100%!important;height:auto!important;}
</style>
<script src="/js/supabase.js"></script>
</head>
<body>
<nav class="nav"><div class="nav-inner"><a class="nav-logo" href="/">Ivy<span>Life</span></a>
<ul class="nav-links" id="navLinks">
<li><a href="/category/tastyfood">美食餐廳</a></li>
<li><a href="/category/hotel">飯店民宿</a></li>
<li><a href="/category/beauty">醫學美容</a></li>
<li><a href="/category/renovation">宅修清潔</a></li>

</ul>
<div class="nav-hamburger" id="hamburger" onclick="document.getElementById('navLinks').classList.toggle('open')"><span></span><span></span><span></span></div>
</div></nav>
<main>
  <div id="art-wrap" class="art-wrap">
    <div class="loading-state"><p>載入中…</p></div>
  </div>
</main>
<footer class="footer">
  <div class="footer-inner" style="text-align:center;padding:2rem;font-size:0.85rem;color:var(--text-light,#888)">
    <p>© 2026 IvyLife 艾薇生活 · 用文字記錄每一刻美好</p>
  </div>
</footer>
<script>

  document.getElementById('hamburger')?.addEventListener('click',()=>{
    document.getElementById('navLinks')?.classList.toggle('open');
  });
async function load(){
  const params = new URLSearchParams(location.search);
  const slugFromQuery = params.get('slug');
  const parts = location.pathname.split('/').filter(Boolean);
  const slug = slugFromQuery || decodeURIComponent(parts[parts.length-1]);
  const wrap = document.getElementById('art-wrap');
  if(!slug){ wrap.innerHTML='<div class="error-state"><h2>找不到文章</h2><p><a href="/">回首頁</a></p></div>'; return; }
  try{
    // Prefer inline SSR data (set by functions/article/[slug].js) over a fresh Supabase round-trip
    let data = null;
    const ssrEl = document.getElementById('__ssr_article');
    if (ssrEl) {
      try { data = JSON.parse(ssrEl.textContent); } catch(_) {}
    }
    if (!data) data = await getArticleBySlug(slug);
    if(!data){
      wrap.innerHTML='<div class="error-state"><h2>文章不存在</h2><p><a href="/">回首頁</a></p></div>';
      return;
    }
    const catName = data.ivy_categories?.name || '';
    const catSlug = data.ivy_categories?.slug || '';
    const pubDate = formatDate(data.published_at||data.created_at);
    
    // SEO meta
    document.getElementById('page-title').textContent = (data.meta_title||data.title)+' - IvyLife';
    document.getElementById('meta-desc').content = data.meta_description||data.synopsis||'';
    document.getElementById('canonical-url').href = 'https://ivylife.com.tw/article/'+slug;
    document.getElementById('og-title').content = data.title;
    document.getElementById('og-desc').content = data.meta_description||data.synopsis||'';
    if(data.cover_image) document.getElementById('og-image').content = data.cover_image;
    
    wrap.innerHTML = `
      <a class="art-back" href="${catSlug?'/category/'+catSlug:'/'}">← ${catName||'返回首頁'}</a>
      <h1 class="art-title">${data.title||''}</h1>
      ${catName?`<div><span class="art-cat-badge">${catName}</span></div>`:''}
      ${data.cover_image?`<img class="art-cover" src="${data.cover_image.replace(/\(/g,'%28').replace(/\)/g,'%29').replace(/ /g,'%20')}" alt="${data.title||''}" onerror="this.style.display='none'">`:''}
      
      <div class="art-meta">
        ${pubDate?`<span>📅 ${pubDate}</span>`:''}
        ${catName?`<span>📁 ${catName}</span>`:''}
      </div>
      ${(data.synopsis&&data.content&&(function(){var t=document.createElement("div");t.innerHTML=data.content;return t.textContent.indexOf(data.synopsis)<0;})())?`<p class="art-synopsis">${data.synopsis}</p>`:''}
      <div class="art-content" id="art-body"></div>
      </div>
      <div class="art-footer-line">感謝閱讀 · 艾薇生活</div>
    `;
    // post-process: fill content + keywords + dedup cover
    var ab=document.getElementById("art-body");
    if(ab){
      var c=data.content||"";
      if(data.cover_image){
        var fn=decodeURIComponent(data.cover_image.split("/").pop().split("?")[0]);
        var tmp=document.createElement("div");
        tmp.innerHTML=c;
        tmp.querySelectorAll("img").forEach(function(img){
          var s=img.getAttribute("src")||"";
          var sfn=decodeURIComponent(s.split("/").pop().split("?")[0]);if(s===data.cover_image||sfn===fn||s.indexOf(fn)>-1||fn.indexOf(sfn)>-1) img.remove();
        });
        c=tmp.innerHTML;
      }
      if(data.keywords){
        var khtml=data.keywords.split(",").map(function(k){
          var t=k.trim();
          return "<a class=\"art-kw-tag\" href=\"/index.html?kw="+encodeURIComponent(t)+"\">" +t+"</a>";
        }).join("");
        c+="<div class=\"art-keywords\">" +khtml+"</div>";
      }
      ab.innerHTML=c;
      // DOM-level cover dedup
      var coverEl=document.querySelector('.art-cover');
      if(coverEl&&coverEl.getAttribute('src')){
        var cSrc=coverEl.getAttribute('src')||'';
        var cFn=decodeURIComponent(cSrc.split('/').pop().split('?')[0]).toLowerCase();
        // 比對檔名 OR 完整 URL
        document.querySelectorAll('#art-body img').forEach(function(img){
          var s=img.getAttribute('src')||'';
          var sFn=decodeURIComponent(s.split('/').pop().split('?')[0]).toLowerCase();
          var match=false;
          if(sFn&&sFn===cFn)match=true;
          else if(s===cSrc)match=true;
          else if(cFn&&sFn&&(sFn.includes(cFn)||cFn.includes(sFn)))match=true;
          if(match){
            // 移除 img 和空的 parent
            var parent=img.parentNode;
            img.remove();
            if(parent&&parent.tagName==='P'&&parent.children.length===0&&!parent.textContent.trim()){
              parent.remove();
            }
          }
        });
        // 也檢查 figure 包見的 img
        document.querySelectorAll('#art-body figure').forEach(function(fig){
          if(fig.children.length===0||(fig.children.length===1&&fig.children[0].tagName==='FIGCAPTION')){
            fig.remove();
          }
        });
      }
      // YouTube 連結轉 iframe
      (function(){
        var ytRe=/(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?(?:[\w=&]*&)?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/;
        function makeIframe(vid,parent,el){
          var w=document.createElement('div');
          w.style='position:relative;padding-bottom:56.25%;height:0;margin:20px 0';
          w.innerHTML='<iframe style="position:absolute;top:0;left:0;width:100%;height:100%;border:0" src="https://www.youtube.com/embed/'+vid+'" allowfullscreen allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture"></iframe>';
          parent.replaceChild(w,el);
        }
        // 掃 <a> 標籤
        document.querySelectorAll('#art-body a').forEach(function(a){
          var href=a.getAttribute('href')||'';
          var m=href.match(ytRe);
          if(m){var target=a.parentNode;if(target.tagName==='P'&&target.children.length===1)makeIframe(m[1],target.parentNode,target);else makeIframe(m[1],target,a);}
        });
        // 掃純文字段落
        document.querySelectorAll('#art-body p,#art-body div').forEach(function(el){
          if(el.children.length>0)return;
          var txt=(el.textContent||'').trim();
          var m=txt.match(ytRe);
          if(m)makeIframe(m[1],el.parentNode,el);
        });
      })();

      // 圖片 data-link 轉 <a> 包裝
      document.querySelectorAll('#art-body img[data-link]').forEach(function(img){
        var link=img.getAttribute('data-link');
        if(!link)return;
        // 若已包在 <a> 裡就跳過
        if(img.parentElement&&img.parentElement.tagName==='A')return;
        var a=document.createElement('a');
        a.href=link;
        a.target='_blank';
        a.rel='noopener noreferrer';
        img.parentNode.insertBefore(a,img);
        a.appendChild(img);
      });
      // Fix TOC: 痞客邦目錄跳轉修復
      // Quill 會刪掉 <a name="xxx"> 錨點，需在前台重建 id
      (function(){
        var tocLinks=[...ab.querySelectorAll('a[href^="#"]')];
        if(!tocLinks.length) return;
        var headings=[...ab.querySelectorAll('h2,h3,h4,h5')];
        // Step1: 還原任何殘留的 name 屬性
        ab.querySelectorAll('a[name]').forEach(function(a){
          if(!a.id) a.id=a.getAttribute('name');
        });
        // Step2: 對每個 TOC 連結找對應標題
        tocLinks.forEach(function(link){
          var tid=link.getAttribute('href').substring(1);
          if(!tid) return;
          // 如果 id 已存在就不用處理
          if(document.getElementById(tid)||ab.querySelector('[id="'+tid+'"]')) return;
          var lt=link.textContent.trim();
          if(!lt) return;
          var best=null,bestScore=0;
          headings.forEach(function(h){
            if(h.id) return; // 已有 id 不重複指派
            var ht=h.textContent.trim();
            if(ht===lt){best=h;bestScore=100;return;}
            // 包含比對
            if(ht.includes(lt)||lt.includes(ht)){
              var score=Math.min(ht.length,lt.length)/Math.max(ht.length,lt.length)*99;
              if(score>bestScore){best=h;bestScore=score;}
            }
          });
          if(best&&bestScore>50) best.id=tid;
        });
        // Step3: 讓 TOC 連結平滑捲動
        tocLinks.forEach(function(link){
          link.addEventListener('click',function(e){
            var tid=link.getAttribute('href').substring(1);
            var el=document.getElementById(tid);
            if(el){e.preventDefault();el.scrollIntoView({behavior:'smooth',block:'start'});}
          });
        });
      })();
      // fix: hash scroll after async content load
      if(location.hash){
        setTimeout(function(){
          var hid=location.hash.slice(1);
          var tgt=document.getElementById(hid)||document.querySelector('[name="'+hid+'"]');
          if(tgt){
            var top=tgt.getBoundingClientRect().top+window.pageYOffset-80;
            window.scrollTo({top:top,behavior:'smooth'});
          }
        },300);
      }
      // fix: anchor links click handler
      document.querySelectorAll('#art-body a[href^="#"]').forEach(function(a){
        a.removeAttribute('target');
        a.addEventListener('click',function(e){
          e.preventDefault();
          var hid=this.getAttribute('href').slice(1);
          var tgt=document.getElementById(hid)||document.querySelector('[name="'+hid+'"]');
          if(tgt){
            var top=tgt.getBoundingClientRect().top+window.pageYOffset-80;
            window.scrollTo({top:top,behavior:'smooth'});
          }
        });
      });
      // hide synopsis if it appears in content text
      var synEl=document.querySelector(".art-synopsis");
      if(synEl&&synEl.textContent.trim()){
        var tmp2=document.createElement("div");tmp2.innerHTML=c;
        if(tmp2.textContent.indexOf(synEl.textContent.trim())>-1) synEl.style.display="none";
      }
    }

  }catch(e){
    console.error('load error:', e);
    wrap.innerHTML='<div class="error-state"><h2>載入失敗</h2><p>'+e.message+'</p><p><a href="/">回首頁</a></p></div>';
  }
}
document.addEventListener('DOMContentLoaded', load);
</script>
