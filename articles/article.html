<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title id="page-title">IvyLife 艾薇生活</title>
<meta name="description" id="meta-desc" content="艾薇的生活分享">
<link rel="canonical" id="canonical-url" href="https://ivylife.com.tw">
<meta property="og:title" id="og-title" content="IvyLife">
<meta property="og:description" id="og-desc" content="">
<meta property="og:image" id="og-image" content="https://ivylife.com.tw/og-default.jpg">
<meta property="og:type" content="article">
<link rel="stylesheet" href="/css/style.css">
<style>
.art-wrap{max-width:780px;margin:0 auto;padding:2rem 1.5rem 4rem}
.art-cover{width:100%;max-height:450px;object-fit:cover;border-radius:12px;margin-bottom:2rem;display:block}
.art-cat{font-size:0.78rem;color:var(--primary,#c9697a);font-weight:600;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:0.5rem}
.art-title{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:700;line-height:1.3;margin-bottom:1rem;color:var(--text-dark,#2c2c2c)}
.art-meta{font-size:0.82rem;color:var(--text-light,#888);margin-bottom:1.5rem;display:flex;gap:1rem;flex-wrap:wrap}
.art-synopsis{font-size:1.05rem;line-height:1.8;color:var(--text,#555);border-left:3px solid var(--primary,#c9697a);padding-left:1rem;margin-bottom:2rem;font-style:italic}
.art-content{font-size:1rem;line-height:1.9;color:var(--text,#555)}
.art-content h2{font-size:1.35rem;font-weight:700;margin:2rem 0 0.8rem;color:var(--text-dark,#2c2c2c)}
.art-content h3{font-size:1.15rem;font-weight:600;margin:1.5rem 0 0.6rem;color:var(--text-dark,#2c2c2c)}
.art-content p{margin-bottom:1.2rem}
.art-content img{width:100%;border-radius:8px;margin:1rem 0}
.art-back{display:inline-flex;align-items:center;gap:0.4rem;color:var(--primary,#c9697a);text-decoration:none;font-size:0.88rem;margin-bottom:1.5rem}
.art-back:hover{text-decoration:underline}
.loading-state,.error-state{text-align:center;padding:4rem 2rem;color:var(--text-light,#888)}
</style>
</head>
<body>
<script src="/js/supabase.js"></script>
<header class="site-header">
  <div class="header-inner">
    <a href="/" class="logo">IvyLife</a>
    <nav class="nav-links">
      <a href="/category/food">美食餐廳</a>
      <a href="/category/hotel">飯店民宿</a>
      <a href="/category/beauty">醫學美容</a>
      <a href="/category/cleaning">宅修清潔</a>
      <a href="/category/design">設計推薦</a>
      <a href="/about.html">關於艾薇</a>
    </nav>
  </div>
</header>
<main>
  <div id="art-wrap" class="art-wrap">
    <div class="loading-state">載入中…</div>
  </div>
</main>
<footer class="site-footer">
  <div class="footer-inner">
    <p>© 2026 IvyLife 艾薇生活 · 用文字記錄每一刻美好</p>
  </div>
</footer>
<script>
async function load(){
  const slug = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop());
  const wrap = document.getElementById('art-wrap');
  if(!slug){ wrap.innerHTML='<div class="error-state"><h2>找不到文章</h2></div>'; return; }
  try{
    const data = await getArticleBySlug(slug);
    if(!data){ wrap.innerHTML='<div class="error-state"><h2>文章不存在</h2><p><a href="/">回首頁</a></p></div>'; return; }
    
    const catName = data.ivy_categories?.name || '';
    const catSlug = data.ivy_categories?.slug || '';
    
    // Update SEO meta
    document.getElementById('page-title').textContent = (data.meta_title || data.title) + ' - IvyLife';
    document.getElementById('meta-desc').content = data.meta_description || data.synopsis || '';
    document.getElementById('canonical-url').href = 'https://ivylife.com.tw/article/' + slug;
    document.getElementById('og-title').content = data.title;
    document.getElementById('og-desc').content = data.meta_description || data.synopsis || '';
    if(data.cover_image) document.getElementById('og-image').content = data.cover_image;
    
    wrap.innerHTML = `
      <a class="art-back" href="${catSlug?'/category/'+catSlug:'/'}">← ${catName||'返回'}</a>
      ${data.cover_image ? `<img class="art-cover" src="${data.cover_image}" alt="${data.title}">` : ''}
      ${catName ? `<div class="art-cat">${catName}</div>` : ''}
      <h1 class="art-title">${data.title}</h1>
      <div class="art-meta">
        <span>📅 ${formatDate(data.published_at||data.created_at)}</span>
        ${catName ? `<span>📁 ${catName}</span>` : ''}
      </div>
      ${data.synopsis ? `<p class="art-synopsis">${data.synopsis}</p>` : ''}
      <div class="art-content">${data.content||''}</div>
    `;
  }catch(e){
    wrap.innerHTML='<div class="error-state"><h2>載入失敗</h2><p>'+e.message+'</p><p><a href="/">回首頁</a></p></div>';
  }
}
load();
</script>
</body>
</html>
