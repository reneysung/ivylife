<script>
const PAGE_SIZE=12;let pg=0;
async function loadPage(p=0){
  const params=new URLSearchParams(window.location.search);
  // Support both /category?cat=X and /category/X
  const pathMatch=window.location.pathname.match(/^\/category\/([^/?#]+)/);
  const catSlug=params.get('cat')||(pathMatch?decodeURIComponent(pathMatch[1]):'');
  // If SSR already rendered cards (CF Pages Function path), skip the re-fetch on first page
  const grid=document.getElementById('articleGrid');
  if(p===0 && grid && grid.getAttribute('data-ssr')==='1'){
    // Still update title/meta from category data, but don't blow away the SSR cards
    try{
      const cats=await getCategories();
      const c=cats.find(x=>x.slug===catSlug);
      if(c){
        document.title=c.name+' - IvyLife 艾薇生活';
        document.getElementById('breadCat').textContent=c.name;
        document.getElementById('catIcon').textContent=c.icon||'';
        document.getElementById('catTitle').textContent=c.name;
        document.getElementById('catDesc').textContent=c.description||(c.name+' 主題文章精選 — 艾薇分享台灣各地'+c.name+'相關體驗。');
      }
    }catch(e){}
    return;
  }
  try{
    const cats=await getCategories();
    const c=cats.find(x=>x.slug===catSlug);
    if(c){
      document.title=c.name+' - IvyLife 艾薇生活';
      document.getElementById('metaTitle').textContent=c.name+' - IvyLife 艾薇生活';
      document.getElementById('metaDesc').content=c.description||(c.name+' 主題文章精選 — 艾薇分享台灣各地'+c.name+'相關體驗。');
      document.getElementById('canonical').href='https://ivylife.com.tw/category/'+catSlug;
      document.getElementById('catIcon').textContent=c.icon||'';
      document.getElementById('catTitle').textContent=c.name;
      document.getElementById('catDesc').textContent=c.description||'';
      document.getElementById('breadCat').textContent=c.name;
    }
    const as=await getArticles({categorySlug:catSlug,limit:PAGE_SIZE,offset:p*PAGE_SIZE});
    const g=document.getElementById('articleGrid');
    if(!as.length&&p===0){g.innerHTML='<p style="grid-column:1/-1;text-align:center;color:var(--text-light);padding:3rem">此分類尚無文章</p>';return;}
    g.innerHTML=as.map(a=>'<a class="article-card fade-in" href="/article/'+(a.slug||a.id)+'" style="text-decoration:none;color:inherit"><div class="card-img"'+(a.cover_image?' style=\"background-image:url('+ivThumb(a.cover_image,600)+');background-size:cover;background-position:center\"':'')+'>'+(a.cover_image?'':categoryIcon(a.ivy_categories?.name||''))+'</div><div class="card-body"><span class="card-category">'+(a.ivy_categories?.name||'')+'</span><h3 class="card-title">'+a.title+'</h3><p class="card-synopsis">'+(a.synopsis||'')+'</p><span class="card-meta">'+formatDate(a.created_at)+'</span></div></a>').join('');
    let pag='';
    if(p>0)pag+='<a href="#" onclick="changePage('+(p-1)+')">‹</a>';
    pag+='<span class="active">'+(p+1)+'</span>';
    if(as.length===PAGE_SIZE)pag+='<a href="#" onclick="changePage('+(p+1)+')">›</a>';
    document.getElementById('pagination').innerHTML=pag;
  }catch(e){document.getElementById('articleGrid').innerHTML='<p style="grid-column:1/-1">'+e.message+'</p>';}
}
function changePage(p){pg=p;window.scrollTo(0,0);loadPage(p);return false;}
loadPage();
</script>
